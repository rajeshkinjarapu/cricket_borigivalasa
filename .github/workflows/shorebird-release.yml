name: Shorebird Release (Base APK)

on:
  workflow_dispatch:

jobs:
  release:
    name: Build Shorebird Base APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")" > android/local.properties
          cat android/local.properties

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Build Shorebird Release
        run: shorebird release android --artifact=apk
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shorebird-release-apk
          path: build/app/outputs/**/app-release.apk
          retention-days: 14
