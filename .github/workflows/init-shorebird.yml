name: Init Shorebird

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android local.properties
        run: |
          mkdir -p android
          echo "flutter.sdk=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")" > android/local.properties
          cat android/local.properties

      - name: Validate Android Gradle wrapper
        run: |
          test -f android/gradlew
          chmod +x android/gradlew
          ./android/gradlew --version

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Run Shorebird Init
        run: shorebird init --force --display-name "cricket_scoring_app"
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Commit shorebird.yaml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml
          git diff --cached --quiet || git commit -m "chore: initialize shorebird configuration"
          git push
