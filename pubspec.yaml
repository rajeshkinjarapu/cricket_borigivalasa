name: borigivalasa_cricket
description: "Borigivalasa Cricket Scoring App - Professional & Colorful"
publish_to: 'none'
version: 1.0.2+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^2.24.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  cached_network_image: ^4.0.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  share_plus: ^7.2.1
  screenshot: ^2.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.2
  provider: ^6.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: any
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/images/
